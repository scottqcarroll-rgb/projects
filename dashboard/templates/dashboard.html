<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .server-time {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9rem;
            color: #8b949e;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7b2cbf);
            border-radius: 2px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .metric-row:last-child {
            border-bottom: none;
        }
        .metric-row span:first-child {
            color: #8b949e;
            font-size: 0.9rem;
        }
        .metric-value {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .loading {
            color: #8b949e;
            font-style: italic;
        }
        .weather-icon-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-icon-large {
            font-size: 3rem;
        }
        .status-ok {
            color: #00b894 !important;
        }
        .status-warn {
            color: #fdcb6e !important;
        }
        .status-error {
            color: #e17055 !important;
        }
        
        /* Chat styles */
        .chat-container {
            grid-column: 1 / -1;
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 16px;
        }
        .chat-input-area {
            display: flex;
            gap: 12px;
        }
        .chat-input-area textarea {
            flex: 1;
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            color: #e6edf3;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            min-height: 50px;
            max-height: 120px;
        }
        .chat-input-area textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .chat-input-area button {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            align-self: flex-end;
        }
        .chat-input-area button:hover:not(:disabled) {
            opacity: 0.9;
        }
        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chat-message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.user {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        .chat-message.assistant {
            background: rgba(123, 44, 191, 0.1);
            border: 1px solid rgba(123, 44, 191, 0.3);
        }
        .chat-message .role {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .chat-message.user .role { color: #00d4ff; }
        .chat-message.assistant .role { color: #7b2cbf; }
        .chat-message .content {
            white-space: pre-wrap;
            color: #e6edf3;
            line-height: 1.5;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .camera-item {
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
        }
        .camera-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .camera-item .name {
            padding: 8px;
            font-weight: 500;
            font-size: 0.85rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .chat-container {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard</h1>
            <div class="server-time" id="server-time">Loading...</div>
        </header>
        
        <div class="grid">
            <!-- AM Drive Report -->
            <div class="card">
                <h2>AM Drive</h2>
                <div id="drive-data" class="loading">Loading...</div>
            </div>
            
            <!-- PM Drive Report -->
            <div class="card">
                <h2>PM Drive</h2>
                <div id="pm-drive-data" class="loading">Loading...</div>
            </div>
            
            <!-- Weather -->
            <div class="card">
                <h2>Weather</h2>
                <div id="weather-data" class="loading">Loading...</div>
            </div>
            
            <!-- Links -->
            <div class="card">
                <h2>Quick Links</h2>
                <div id="links-data" class="loading">Loading...</div>
            </div>
            
            <!-- Gmail -->
            <div class="card">
                <h2>Gmail</h2>
                <div id="gmail-data" class="loading">Loading...</div>
            </div>
            
            <!-- OpenRouter Usage -->
            <div class="card">
                <h2>OpenRouter Usage</h2>
                <div id="openroute-data" class="loading">Loading...</div>
            </div>
            
            <!-- Ollama Models on Mac Studio -->
            <div class="card">
                <h2>Ollama (Mac Studio)</h2>
                <div id="gemma-data" class="loading">Loading...</div>
            </div>
            
            <!-- Linux Server -->
            <div class="card">
                <h2>Linux Server</h2>
                <div id="linux-server-data" class="loading">Loading...</div>
            </div>
            
            <!-- Mac Studio -->
            <div class="card">
                <h2>Mac Studio</h2>
                <div id="mac-studio-data" class="loading">Loading...</div>
            </div>
            
            <!-- Cameras -->
            <div class="card">
                <h2>Cameras</h2>
                <div id="cameras-data" class="loading">Loading...</div>
            </div>
            
            <!-- LLM Metrics -->
            <div class="card">
                <h2>LLM Metrics</h2>
                <div id="llm-metrics-data" class="loading">Loading...</div>
            </div>
            
            <!-- Chat with Ollama -->
            <div class="card chat-container">
                <h2>Chat</h2>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <textarea id="chat-input" placeholder="Ask anything... (Enter to send, Shift+Enter for new line)"></textarea>
                    <button id="chat-send" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load server time
        async function loadServerTime() {
            try {
                const res = await fetch('/api/time');
                const data = await res.json();
                if (data.time) {
                    document.getElementById('server-time').textContent = data.time;
                }
            } catch (e) {
                console.error('Failed to load server time:', e);
            }
        }

        // Load AM Drive Report
        async function loadDriveReport() {
            try {
                const res = await fetch('/api/drive');
                const data = await res.json();
                const el = document.getElementById('drive-data');
                if (data.status === 'ok') {
                    el.innerHTML = `
                        <div class="metric-row"><span>From</span><span class="metric-value">${data.origin || 'N/A'}</span></div>
                        <div class="metric-row"><span>To</span><span class="metric-value">${data.destination || 'N/A'}</span></div>
                        <div class="metric-row"><span>Departure</span><span class="metric-value">${data.departure_time || 'N/A'}</span></div>
                        <div class="metric-row"><span>Arrival</span><span class="metric-value">${data.arrival_time || 'N/A'}</span></div>
                        <div class="metric-row"><span>Distance</span><span class="metric-value">${data.distance_miles} mi</span></div>
                        <div class="metric-row"><span>Duration</span><span class="metric-value">${data.duration_minutes} min</span></div>
                        <div class="metric-row"><span>Status</span><span class="metric-value ${data.status === 'ok' ? 'status-ok' : 'status-error'}">${data.status.toUpperCase()}</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('drive-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load PM Drive Report
        async function loadPMDriveReport() {
            try {
                const res = await fetch('/api/pm-drive');
                const data = await res.json();
                const el = document.getElementById('pm-drive-data');
                if (data.status === 'ok') {
                    el.innerHTML = `
                        <div class="metric-row"><span>From</span><span class="metric-value">${data.origin || 'N/A'}</span></div>
                        <div class="metric-row"><span>To</span><span class="metric-value">${data.destination || 'N/A'}</span></div>
                        <div class="metric-row"><span>Departure</span><span class="metric-value">${data.departure_time || 'N/A'}</span></div>
                        <div class="metric-row"><span>Arrival</span><span class="metric-value">${data.arrival_time || 'N/A'}</span></div>
                        <div class="metric-row"><span>Distance</span><span class="metric-value">${data.distance_miles} mi</span></div>
                        <div class="metric-row"><span>Duration</span><span class="metric-value">${data.duration_minutes} min</span></div>
                        <div class="metric-row"><span>Status</span><span class="metric-value ${data.status === 'ok' ? 'status-ok' : 'status-error'}">${data.status.toUpperCase()}</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('pm-drive-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load Weather
        async function loadWeather() {
            try {
                const res = await fetch('/api/weather');
                const data = await res.json();
                const el = document.getElementById('weather-data');
                if (data.status === 'ok') {
                    const icon = getWeatherIcon(data.condition);
                    el.innerHTML = `
                        <div class="metric-row weather-icon-row"><span></span><span class="metric-value weather-icon-large">${icon}</span></div>
                        <div class="metric-row"><span>Temperature</span><span class="metric-value">${data.temperature}°F</span></div>
                        <div class="metric-row"><span>Condition</span><span class="metric-value">${data.condition}</span></div>
                        <div class="metric-row"><span>Humidity</span><span class="metric-value">${data.humidity}%</span></div>
                        <div class="metric-row"><span>Wind</span><span class="metric-value">${data.wind_speed} mph</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('weather-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        function getWeatherIcon(condition) {
            const c = condition.toLowerCase();
            if (c.includes('clear') || c.includes('sunny')) return '☀️';
            if (c.includes('cloud') || c.includes('overcast')) return '☁️';
            if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return '🌧️';
            if (c.includes('storm') || c.includes('thunder')) return '⛈️';
            if (c.includes('snow') || c.includes('sleet') || c.includes('ice')) return '❄️';
            if (c.includes('fog') || c.includes('mist') || c.includes('haze')) return '🌫️';
            if (c.includes('wind')) return '💨';
            return '🌤️';
        }

        // Load Links
        async function loadLinks() {
            try {
                const res = await fetch('/api/links');
                const data = await res.json();
                const el = document.getElementById('links-data');
                if (data.status === 'ok' && data.links) {
                    el.innerHTML = data.links.map(link => 
                        `<a href="${link.url}" target="_blank" style="display: block; color: #00d4ff; text-decoration: none; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                            ${link.name}
                        </a>`
                    ).join('');
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('links-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load Gmail Summary
        async function loadGmail() {
            try {
                const res = await fetch('/api/gmail');
                const data = await res.json();
                const el = document.getElementById('gmail-data');
                if (data.status === 'ok') {
                    el.innerHTML = `
                        <div class="metric-row"><span>Unread</span><span class="metric-value">${data.unread_count}</span></div>
                        <div class="metric-row"><span>Total</span><span class="metric-value">${data.total_count}</span></div>
                        <div class="metric-row"><span>Starred</span><span class="metric-value">${data.starred_count}</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">${data.message || 'Not configured'}</span>`;
                }
            } catch (e) {
                document.getElementById('gmail-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load OpenRouter Usage
        async function loadOpenRoute() {
            try {
                const res = await fetch('/api/usage');
                const data = await res.json();
                const el = document.getElementById('openroute-data');
                if (data.status === 'ok') {
                    const formatNum = n => n ? n.toLocaleString() : 'N/A';
                    const usageTotal = formatNum(data.usage_total);
                    const usageDaily = formatNum(data.usage_daily);
                    const usageWeekly = formatNum(data.usage_weekly);
                    const usageMonthly = formatNum(data.usage_monthly);
                    const limit = data.limit !== null ? formatNum(data.limit) : 'Unlimited';
                    const remaining = data.limit_remaining !== null ? formatNum(data.limit_remaining) : 'N/A';
                    const freeTier = data.is_free_tier ? 'Free Tier' : 'Paid';
                    
                    el.innerHTML = `
                        <div class="metric-row"><span>Account</span><span class="metric-value">${data.label || 'N/A'}</span></div>
                        <div class="metric-row"><span>Plan</span><span class="metric-value">${freeTier}</span></div>
                        <div class="metric-row"><span>Total Credits</span><span class="metric-value">${usageTotal}</span></div>
                        <div class="metric-row"><span>Today</span><span class="metric-value">${usageDaily}</span></div>
                        <div class="metric-row"><span>This Week</span><span class="metric-value">${usageWeekly}</span></div>
                        <div class="metric-row"><span>This Month</span><span class="metric-value">${usageMonthly}</span></div>
                        <div class="metric-row"><span>Limit</span><span class="metric-value">${limit}</span></div>
                        <div class="metric-row"><span>Remaining</span><span class="metric-value">${remaining}</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('openroute-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load Ollama Models on Mac Studio
        async function loadOllamaModelStatus() {
            try {
                const res = await fetch('/api/mac-studio/ollama');
                const data = await res.json();
                const el = document.getElementById('gemma-data');
                if (data.status === 'ok' && data.models && data.models.length > 0) {
                    const model = data.models[0];
                    el.innerHTML = `
                        <div class="metric-row"><span>Status</span><span class="metric-value status-ok">Ollama Running</span></div>
                        <div class="metric-row"><span>Model</span><span class="metric-value">${model.name}</span></div>
                        <div class="metric-row"><span>Size</span><span class="metric-value">${model.size}</span></div>
                        <div class="metric-row"><span>Modified</span><span class="metric-value">${model.modified}</span></div>
                        <div class="metric-row"><span>Running</span><span class="metric-value ${model.running ? 'status-ok' : 'status-warn'}">${model.running ? 'Yes' : 'No'}</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">No models installed</span>`;
                }
            } catch (e) {
                document.getElementById('gemma-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load Linux Server Status
        async function loadLinuxServer() {
            try {
                const res = await fetch('/api/linux-server');
                const data = await res.json();
                const el = document.getElementById('linux-server-data');
                if (data.status === 'ok') {
                    el.innerHTML = `
                        <div class="metric-row"><span>Host</span><span class="metric-value">${data.hostname || 'clawz840'}</span></div>
                        <div class="metric-row"><span>CPU</span><span class="metric-value">${data.cpu_model || 'Unknown'}</span></div>
                        <div class="metric-row"><span>Load (1m/5m/15m)</span><span class="metric-value">${data.load_1m} / ${data.load_5m} / ${data.load_15m}</span></div>
                        <div class="metric-row"><span>Memory</span><span class="metric-value">${data.memory_used_pct}% used (${data.memory_avail_gb} GB free of ${data.memory_total_gb} GB)</span></div>
                        <div class="metric-row"><span>Disk</span><span class="metric-value">${data.disk_pct} used (${data.disk_used} / ${data.disk_total})</span></div>
                        <div class="metric-row"><span>Uptime</span><span class="metric-value">${data.uptime || 'N/A'}</span></div>
                        <div class="metric-row"><span>CPU Temp</span><span class="metric-value">${data.cpu_temp || 'N/A'}</span></div>
                        <div class="metric-row"><span>IP</span><span class="metric-value">${data.ip || 'N/A'}</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('linux-server-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load Mac Studio Status
        async function loadMacStudio() {
            try {
                const res = await fetch('/api/mac-studio');
                const data = await res.json();
                const el = document.getElementById('mac-studio-data');
                if (data.status === 'ok') {
                    el.innerHTML = `
                        <div class="metric-row"><span>Host</span><span class="metric-value">${data.hostname || 'macstudio'}</span></div>
                        <div class="metric-row"><span>Model</span><span class="metric-value">${data.model || 'N/A'}</span></div>
                        <div class="metric-row"><span>Chip</span><span class="metric-value">${data.chip || 'N/A'}</span></div>
                        <div class="metric-row"><span>OS</span><span class="metric-value">${data.os || 'N/A'}</span></div>
                        <div class="metric-row"><span>RAM</span><span class="metric-value">${data.ram || 'N/A'}</span></div>
                        <div class="metric-row"><span>Storage</span><span class="metric-value">${data.storage || 'N/A'}</span></div>
                        <div class="metric-row"><span>Load (1m/5m/15m)</span><span class="metric-value">${data.load_1m} / ${data.load_5m} / ${data.load_15m}</span></div>
                        <div class="metric-row"><span>Memory</span><span class="metric-value">${data.memory_used_pct}% used (${data.memory_used_gb} GB / ${data.memory_total_gb} GB)</span></div>
                        <div class="metric-row"><span>Disk</span><span class="metric-value">${data.disk_pct} used (${data.disk_used} / ${data.disk_total})</span></div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('mac-studio-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load Cameras
        async function loadCameras() {
            try {
                const res = await fetch('/api/cameras');
                const data = await res.json();
                const el = document.getElementById('cameras-data');
                if (data.status === 'ok') {
                    const cameras = data.cameras || [];
                    if (cameras.length === 0) {
                        el.innerHTML = '<span class="loading">No cameras found</span>';
                        return;
                    }
                    el.innerHTML = `
                        <div class="camera-grid">
                            ${cameras.map(cam => `
                                <div class="camera-item">
                                    <img src="${cam.url}" alt="${cam.name || cam.id}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                    <span style="display: none; color: #888; font-size: 0.8rem; padding: 40px; display: block; text-align: center;">Failed to load snapshot</span>
                                    <div class="name">${cam.name || cam.id}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('cameras-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Load LLM Metrics
        async function loadLLMMetrics() {
            try {
                const res = await fetch('/api/llm-metrics');
                const data = await res.json();
                const el = document.getElementById('llm-metrics-data');
                if (data.status === 'ok') {
                    const formatNum = n => n ? n.toLocaleString() : '0';
                    el.innerHTML = `
                        <div class="metric-row"><span>Total Calls</span><span class="metric-value">${formatNum(data.total_calls)}</span></div>
                        <div class="metric-row"><span>Today's Calls</span><span class="metric-value">${formatNum(data.today_calls)}</span></div>
                        <div class="metric-row"><span>Today's Share</span><span class="metric-value">${data.share_of_total}%</span></div>
                        <div class="metric-row"><span>30-Day Avg</span><span class="metric-value">${formatNum(data.avg_30_day)}</span></div>
                        <div class="metric-row"><span>Hourly Rate</span><span class="metric-value">${formatNum(data.hourly_rate)}</span></div>
                        ${data.calls_today.length > 0 ? `
                            <div class="metric-row"><span>Calls Today</span></div>
                            ${data.calls_today.map(ts => `<div class="metric-row" style="margin-left: 12px;"><span>• ${ts}</span></div>`).join('')}
                        ` : '<div class="metric-row"><span>Calls Today</span><span class="metric-value">No calls today</span></div>'}
                    `;
                } else {
                    el.innerHTML = `<span class="loading">Error: ${data.message || 'Unknown'}</span>`;
                }
            } catch (e) {
                document.getElementById('llm-metrics-data').innerHTML = `<span class="loading">Error loading data</span>`;
            }
        }

        // Chat functionality
        let chatHistory = [];
        let defaultModel = 'qwen3:14b';

        async function loadOllamaModels() {
            try {
                const res = await fetch('/api/ollama-models');
                const data = await res.json();
                if (data.models && data.models.length > 0) {
                    window.ollamaModels = data.models;
                    defaultModel = data.models[0].name;
                    console.log('Loaded Ollama models:', data.models.map(m => m.name));
                }
            } catch (e) {
                console.error('Failed to load Ollama models:', e);
            }
        }

        function appendToChat(role, content) {
            const chatMessages = document.getElementById('chat-messages');
            if (!chatMessages) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${role}`;
            
            const roleLabel = role === 'user' ? 'You' : defaultModel;
            const roleColor = role === 'user' ? '#00d4ff' : '#7b2cbf';
            
            msgDiv.innerHTML = `
                <div class="role" style="color: ${roleColor};">${roleLabel}</div>
                <div class="content">${escapeHtml(content)}</div>
            `;

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');
            const message = input.value.trim();

            if (!message) return;

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            // Add user message to chat
            appendToChat('user', message);
            chatHistory.push({role: 'user', content: message});

            try {
                const res = await fetch('/api/ollama-chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: defaultModel,
                        messages: chatHistory,
                        stream: false
                    })
                });

                const data = await res.json();

                if (data.message && data.message.content) {
                    const response = data.message.content;
                    appendToChat('assistant', response);
                    chatHistory.push({role: 'assistant', content: response});
                } else if (data.error) {
                    appendToChat('assistant', `Error: ${data.error}`);
                } else {
                    appendToChat('assistant', 'Error: Unexpected response format');
                }
            } catch (e) {
                appendToChat('assistant', `Error: ${e.message}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }
        }

        // Auto-resize textarea
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');

            if (input) {
                input.addEventListener('input', () => {
                    input.style.height = 'auto';
                    input.style.height = Math.min(input.scrollHeight, 120) + 'px';

                    // Enable/disable send button based on input content
                    if (sendBtn) {
                        sendBtn.disabled = !input.value.trim();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChatMessage();
                    }
                });
            }

            if (sendBtn) {
                sendBtn.addEventListener('click', sendChatMessage);
            }
        });

        // Initialize all loaders
        async function init() {
            await Promise.all([
                loadServerTime(),
                loadDriveReport(),
                loadPMDriveReport(),
                loadWeather(),
                loadLinks(),
                loadGmail(),
                loadOpenRoute(),
                loadOllamaModelStatus(),
                loadLinuxServer(),
                loadMacStudio(),
                loadCameras(),
                loadLLMMetrics(),
                loadOllamaModels()
            ]);
        }

        // Refresh time and weather periodically
        setInterval(() => {
            loadServerTime();
            loadWeather();
        }, 30 * 60 * 1000);

        // Run on page load
        init();
    </script>
</body>
</html>
