<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odor Server — Environmental Monitoring</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #1e293b; }
        h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #22d3ee, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; margin-top: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 1.1rem; font-weight: 600; }
        .status { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status.online { background: #064e3b; color: #34d399; }
        .status.offline { background: #7f1d1d; color: #f87171; }
        .sensor-meta { color: #64748b; font-size: 0.85rem; margin-bottom: 16px; }
        .readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
        .reading { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; text-align: center; }
        .reading-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .reading-value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
        .reading.voc .reading-value { color: #22d3ee; }
        .reading.nh3 .reading-value { color: #fbbf24; }
        .reading.h2s .reading-value { color: #f87171; }
        .reading.ch4 .reading-value { color: #34d399; }
        .reading.co2 .reading-value { color: #a78bfa; }
        .reading-unit { font-size: 0.7rem; color: #64748b; margin-left: 2px; }
        .updated { text-align: center; margin-top: 30px; color: #64748b; font-size: 0.85rem; }
        .refresh-btn { display: inline-block; margin-top: 16px; padding: 10px 20px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; cursor: pointer; transition: all 0.2s; }
        .refresh-btn:hover { background: #334155; border-color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌫️ Odor Server</h1>
            <p class="subtitle">Environmental Monitoring Dashboard</p>
        </header>
        
        <div class="grid" id="sensors-grid">
            {% for sid, sensor in sensors.items() %}
            <div class="card" data-sensor="{{ sid }}">
                <div class="card-header">
                    <span class="card-title">{{ sensor.name }}</span>
                    <span class="status" id="status-{{ sid }}">Loading...</span>
                </div>
                <div class="sensor-meta">
                    {{ sensor.type }} • {{ sensor.location }}
                </div>
                <div class="readings" id="readings-{{ sid }}">
                    <div class="reading voc"><div class="reading-label">VOC</div><div class="reading-value">--</div><div class="reading-unit">ppm</div></div>
                    <div class="reading nh3"><div class="reading-label">NH₃</div><div class="reading-value">--</div><div class="reading-unit">ppb</div></div>
                    <div class="reading h2s"><div class="reading-label">H₂S</div><div class="reading-value">--</div><div class="reading-unit">ppb</div></div>
                    <div class="reading ch4"><div class="reading-label">CH₄</div><div class="reading-value">--</div><div class="reading-unit">ppm</div></div>
                    <div class="reading co2"><div class="reading-label">CO₂</div><div class="reading-value">--</div><div class="reading-unit">ppm</div></div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="updated">
            Last updated: <span id="last-updated">--</span>
            <br><button class="refresh-btn" onclick="fetchData()">Refresh Now</button>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/sensors');
                const data = await res.json();
                if (data.status === 'ok') {
                    document.getElementById('last-updated').textContent = new Date(data.updated).toLocaleTimeString();
                    for (const [sid, sensor] of Object.entries(data.sensors)) {
                        document.getElementById(`status-${sid}`).textContent = sensor.status;
                        document.getElementById(`status-${sid}`).className = `status ${sensor.status}`;
                        
                        const readingsEl = document.getElementById(`readings-${sid}`);
                        if (readingsEl && sensor.readings) {
                            for (const [key, value] of Object.entries(sensor.readings)) {
                                const valEl = readingsEl.querySelector(`.reading.${key.toLowerCase()} .reading-value`);
                                if (valEl) valEl.textContent = value;
                            }
                        }
                    }
                }
            } catch (e) {
                console.error('Fetch failed:', e);
            }
        }
        
        fetchData();
        setInterval(fetchData, 30000); // 30 second auto-refresh
    </script>
</body>
</html>
